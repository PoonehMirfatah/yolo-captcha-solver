<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock CAPTCHA Grid Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --tile: #1f2937;
      --tile2: #243244;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --good: #22c55e;
      --bad: #ef4444;
      --border: rgba(255,255,255,0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(520px, 100%);
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      padding: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .prompt {
      font-size: 1.05rem;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
    }

    .prompt strong {
      color: #ffffff;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    button.control {
      appearance: none;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    button.control:hover { border-color: rgba(96,165,250,0.55); }

    .status {
      min-height: 24px;
      margin: 6px 0 14px;
      color: var(--muted);
      font-weight: 600;
    }

    .status.good { color: var(--good); }
    .status.bad { color: #fca5a5; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 92px);
      gap: 8px;
      justify-content: center;
    }

    .tile {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--tile), var(--tile2));
      display: grid;
      place-items: center;
      cursor: pointer;
      overflow: hidden;
      user-select: none;
      transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
      padding: 0;
    }

    .tile:hover {
      transform: translateY(-1px);
      border-color: rgba(96,165,250,0.45);
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    }

    .tile.selected {
      outline: 3px solid rgba(96,165,250,0.9);
      outline-offset: 0;
    }

    .tile.correct {
      outline: 3px solid rgba(34,197,94,0.95);
    }

    .tile.wrong {
      outline: 3px solid rgba(239,68,68,0.95);
    }

    .label {
      position: absolute;
      left: 10px;
      top: 10px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.2);
      padding: 4px 7px;
      border-radius: 999px;
      z-index: 2;
    }

    .photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.95) contrast(1.02);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .score {
      font-weight: 700;
      color: #ffffff;
    }

    .note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    code {
      background: rgba(255,255,255,0.05);
      padding: 2px 6px;
      border-radius: 6px;
    }

    @media (max-width: 560px) {
      .grid { gap: 10px; }
      .app { padding: 16px; border-radius: 16px; }
      h1 { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Mock CAPTCHA Grid Demo</h1>
    <p class="subtitle">
      Single-file local demo for a “select the squares with the ...” task.
    </p>

    <div class="topbar">
      <div class="prompt">Select all squares with the <strong id="targetName"></strong>.</div>
      <div class="controls">
        <button class="control" id="checkBtn">Check</button>
        <button class="control" id="resetBtn">New Round</button>
      </div>
    </div>

    <div class="status" id="status">Click the tiles that match the prompt, then press Check.</div>

    <div class="grid" id="grid"></div>

    <div class="footer">
      <div>Round: <span class="score" id="roundCount">1</span></div>
      <div>Correct: <span class="score" id="wins">0</span> | Incorrect: <span class="score" id="losses">0</span></div>
    </div>
  </div>

  <script>
    const gridEl = document.getElementById('grid');
    const targetNameEl = document.getElementById('targetName');
    const statusEl = document.getElementById('status');
    const roundCountEl = document.getElementById('roundCount');
    const winsEl = document.getElementById('wins');
    const lossesEl = document.getElementById('losses');
    const checkBtn = document.getElementById('checkBtn');
    const resetBtn = document.getElementById('resetBtn');

    const CLASS_NAMES = [
      'Bicycle',
      'Bridge',
      'Bus',
      'Hydrant',
      'Car',
      'Motorcycle',
      'Cross',
      'Stair',
      'Tlight'
    ];

    //-------------------------------------------------------------- IMPORTANT --------------------------------------------------------------
    // THE "images" FOLDER MUST BE IN THE SAME LOCATION AS THIS FILE
    //-------------------------------------------------------------- IMPORTANT --------------------------------------------------------------
    const IMAGE_DIRS = ['images', '.'];
    const MAX_FILENAME_TRIES = 999;

    let round = 1;
    let wins = 0;
    let losses = 0;
    let target = null;
    let tiles = [];
    let selected = new Set();

    function randInt(max) {
      return Math.floor(Math.random() * max);
    }

    function pick(array) {
      return array[randInt(array.length)];
    }

    function buildCandidatePaths(className) {
      const nums = Array.from({ length: MAX_FILENAME_TRIES }, (_, i) => i + 1);
      for (let i = nums.length - 1; i > 0; i--) {
        const j = randInt(i + 1);
        [nums[i], nums[j]] = [nums[j], nums[i]];
      }

      const candidates = [];
      for (const dir of IMAGE_DIRS) {
        for (const n of nums) {
          const file = `${className} (${n}).png`;
          candidates.push(dir === '.' ? file : `${dir}/${file}`);
        }
      }
      return candidates;
    }

    function createTileImage(imgEl, className, attempt = 0) {
      const candidates = imgEl.dataset.candidates
        ? JSON.parse(imgEl.dataset.candidates)
        : buildCandidatePaths(className);

      imgEl.dataset.candidates = JSON.stringify(candidates);

      if (attempt >= candidates.length) {
        imgEl.alt = `${className} (missing)`;
        imgEl.src = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
            <rect width="300" height="300" rx="20" fill="#334155"/>
            <text x="50%" y="48%" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#e5e7eb">Missing image</text>
            <text x="50%" y="57%" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1">${className}</text>
          </svg>
        `);
        return;
      }

      const src = candidates[attempt];
      imgEl.onerror = () => createTileImage(imgEl, className, attempt + 1);
      imgEl.src = src;
    }

    function newRound() {
      selected = new Set();
      target = pick(CLASS_NAMES);
      targetNameEl.textContent = target;
      roundCountEl.textContent = round;
      statusEl.className = 'status';
      statusEl.textContent = 'Click the tiles that match the prompt, then press Check.';

      const total = 9;
      const targetCount = 2 + randInt(3); // 2..4
      const targetPositions = new Set();
      while (targetPositions.size < targetCount) targetPositions.add(randInt(total));

      const nonTargetClasses = CLASS_NAMES.filter(c => c !== target);
      tiles = Array.from({ length: total }, (_, idx) => {
        const isTarget = targetPositions.has(idx);
        const className = isTarget ? target : pick(nonTargetClasses);
        return { idx, className, isTarget };
      });

      renderGrid();
    }

    function renderGrid() {
      gridEl.innerHTML = '';
      tiles.forEach((tile) => {
        const btn = document.createElement('button');
        btn.className = 'tile';
        btn.type = 'button';
        btn.setAttribute('aria-label', `Tile ${tile.idx + 1}`);
        btn.innerHTML = `
          <div class="label">${tile.idx + 1}</div>
          <img class="photo" alt="${tile.className}" />
        `;

        const img = btn.querySelector('img');
        createTileImage(img, tile.className, 0);

        btn.addEventListener('click', () => {
          if (selected.has(tile.idx)) {
            selected.delete(tile.idx);
            btn.classList.remove('selected');
          } else {
            selected.add(tile.idx);
            btn.classList.add('selected');
          }
        });

        gridEl.appendChild(btn);
      });
    }
    function checkAnswer() {
      const correct = tiles.filter(t => t.isTarget).map(t => t.idx);
      const selectedArr = Array.from(selected).sort((a, b) => a - b);
      const correctSet = new Set(correct);
      const selectedSet = new Set(selectedArr);

      const exactMatch = correct.length === selectedArr.length && correct.every(x => selectedSet.has(x));
      const anyWrongSelected = selectedArr.some(x => !correctSet.has(x));
      const anyMissed = correct.some(x => !selectedSet.has(x));

      const buttons = gridEl.querySelectorAll('.tile');
      buttons.forEach((btn, idx) => {
        btn.classList.remove('correct', 'wrong');
        if (correctSet.has(idx)) btn.classList.add('correct');
        if (selectedSet.has(idx) && !correctSet.has(idx)) btn.classList.add('wrong');
      });

      if (exactMatch) {
        wins += 1;
        winsEl.textContent = wins;
        statusEl.className = 'status good';
        statusEl.textContent = 'Correct.';
      } else {
        losses += 1;
        lossesEl.textContent = losses;
        statusEl.className = 'status bad';
        statusEl.textContent = `Incorrect. ${anyWrongSelected ? 'Some wrong tiles were selected.' : ''} ${anyMissed ? 'Some target tiles were missed.' : ''}`.trim();
      }

      round += 1;
      roundCountEl.textContent = round;
    }

    checkBtn.addEventListener('click', checkAnswer);
    resetBtn.addEventListener('click', newRound);

    newRound();
  </script>
</body>
</html>
